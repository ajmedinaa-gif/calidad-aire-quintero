[project]
name = "calidad-aire-quintero"
version = "0.1.0"
description = "SO2 en Quintero-Puchuncaví: 33 años de datos horarios en tres estaciones, y qué cambió tras el cierre de la Fundición Ventanas"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ajmedinaa-gif" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "ruptures>=1.1",
    "scikit-learn>=1.5",
    "pandera>=0.20",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "jinja2>=3.1",
    "matplotlib>=3.9",
    "streamlit>=1.36",
]

[project.scripts]
caq = "calidad_aire.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calidad_aire"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
